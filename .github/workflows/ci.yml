name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.8.5
      - uses: astral-sh/setup-uv@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: make lint-contracts test-contracts-ci
      - name: Shared EIP-712 vectors are exactly what the contracts produce
        run: |
          # Vectors.t.sol already fails on drift; this also fails if a regenerated file was not committed.
          git diff --exit-code packages/shared/vectors
      - name: Coverage gate (100% lines on contracts/src)
        run: make coverage-contracts
      - name: Slither (fails on medium/high)
        run: uv tool install slither-analyzer && make slither
      - name: Committed ABIs match the contracts
        run: |
          make export-abis-only
          git diff --exit-code packages/shared/src/abis

  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: wattswap
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: wattswap
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U wattswap" --health-interval 5s
          --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s
          --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://wattswap:ci_password@localhost:5432/wattswap
      REDIS_URL: redis://localhost:6379/0
      # Missing postgres/redis/anvil must FAIL the build, never skip tests silently.
      REQUIRE_SERVICES: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.8.5
      - name: Install Foundry libs (the tests run the real Deploy.s.sol on a fresh Anvil)
        run: make contracts-deps
      - run: make lint-api lint-meter-sim test-meter-sim
      - name: Order EIP-712 gate (Python reproduces every Foundry vector, byte for byte)
        run: cd services/api && uv run pytest -q tests/unit/test_order_vectors.py tests/unit/test_order_signatures.py
      - name: API unit + API + migration tests
        run: cd services/api && uv run pytest -q -m "not integration" --cov=app --cov-report=term
      - name: End-to-end gates on Anvil (meter -> mint; pricing; order book -> match -> settle -> confirm)
        run: make test-integration

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: make lint-shared lint-web test-shared test-web
      - run: pnpm --filter @wattswap/web build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: docker compose config --quiet
      - run: docker compose --profile replica config --quiet  # second API replica (WebSocket fan-out)
      - run: docker compose build api web
