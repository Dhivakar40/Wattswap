# WattSwap local stack. The meter simulator is opt-in: `docker compose --profile sim up meter-sim`.
# All config comes from .env (copy .env.example). Dev keys are public Anvil defaults.
name: wattswap

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-wattswap}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-wattswap}
    ports: ["${POSTGRES_PORT:-5432}:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["${REDIS_PORT:-6379}:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  anvil:
    image: ghcr.io/foundry-rs/foundry:v1.8.5
    entrypoint: ["anvil"]
    command:
      - "--host=0.0.0.0"
      - "--port=8545"
      - "--chain-id=${CHAIN_ID:-31337}"
      - "--block-time=${ANVIL_BLOCK_TIME:-1}"
    ports: ["${ANVIL_PORT:-8545}:8545"]
    healthcheck:
      test: ["CMD", "cast", "block-number", "--rpc-url", "http://localhost:8545"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    environment:
      API_ENV: ${API_ENV:-development}
      API_LOG_LEVEL: ${API_LOG_LEVEL:-INFO}
      API_CORS_ORIGINS: ${API_CORS_ORIGINS:-http://localhost:3000}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-wattswap}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-wattswap}
      REDIS_URL: redis://redis:6379/0
      RPC_URL: http://anvil:8545
      CHAIN_ID: ${CHAIN_ID:-31337}
      JWT_SECRET: ${JWT_SECRET:-dev-only-insecure-jwt-secret-change-me-0123456789}
      JWT_TTL_SECONDS: ${JWT_TTL_SECONDS:-43200}
      SIWE_DOMAIN: ${SIWE_DOMAIN:-localhost:3000}
      ADMIN_ADDRESSES: ${ADMIN_ADDRESSES:-}
      READING_INTERVAL_SECONDS: ${READING_INTERVAL_SECONDS:-900}
      MINT_CONFIRMATIONS: ${MINT_CONFIRMATIONS:-1}
      PRICING_ENABLED: ${PRICING_ENABLED:-true}
      PRICING_EMBEDDED: ${PRICING_EMBEDDED:-true}
      PRICING_TICK_SECONDS: ${PRICING_TICK_SECONDS:-15}
      WEATHER_POLL_SECONDS: ${WEATHER_POLL_SECONDS:-600}
      PRICING_CLOCK_MODE: ${PRICING_CLOCK_MODE:-real}
      TRADING_ENABLED: ${TRADING_ENABLED:-true}
      TRADING_EMBEDDED: ${TRADING_EMBEDDED:-true}
      MIN_ORDER_WH: ${MIN_ORDER_WH:-100}
      MIN_FILL_WH: ${MIN_FILL_WH:-100}
      MIN_FILL_COST: ${MIN_FILL_COST:-1000}
      RATE_LIMIT_ORDERS: ${RATE_LIMIT_ORDERS:-30}
      MAX_OPEN_ORDERS_PER_MAKER: ${MAX_OPEN_ORDERS_PER_MAKER:-50}
      QUOTE_SAFETY_MARGIN_SECONDS: ${QUOTE_SAFETY_MARGIN_SECONDS:-60}
      BAND_SAFETY_PCT: ${BAND_SAFETY_PCT:-90}
      SETTLE_MAX_IN_FLIGHT: ${SETTLE_MAX_IN_FLIGHT:-4}
      SETTLE_BUMP_AFTER_SECONDS: ${SETTLE_BUMP_AFTER_SECONDS:-20}
      PAIR_COOLDOWN_SECONDS: ${PAIR_COOLDOWN_SECONDS:-30}
      FUNDING_SWEEP_SECONDS: ${FUNDING_SWEEP_SECONDS:-20}
      LISTENER_CONFIRMATIONS: ${LISTENER_CONFIRMATIONS:-1}
      LISTENER_START_BLOCK: ${LISTENER_START_BLOCK:-0}
      # Role keys. Each must be a DIFFERENT address or the API refuses to start.
      ORACLE_PRIVATE_KEY: ${ORACLE_PRIVATE_KEY:?set ORACLE_PRIVATE_KEY in .env}
      REGISTRAR_PRIVATE_KEY: ${REGISTRAR_PRIVATE_KEY:?set REGISTRAR_PRIVATE_KEY in .env}
      RELAYER_PRIVATE_KEY: ${RELAYER_PRIVATE_KEY:-}
      PRICER_PRIVATE_KEY: ${PRICER_PRIVATE_KEY:-}
    ports: ["${API_PORT:-8000}:8000"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      anvil: { condition: service_healthy }
    healthcheck:
      test:
        - "CMD"
        - "python"
        - "-c"
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status == 200 else 1)"
      interval: 5s
      timeout: 3s
      retries: 10

  # The pricing engine as its own process. Opt-in: set PRICING_EMBEDDED=false in .env so the API does
  # not also run one, then `docker compose --profile pricing up -d pricing`. A leader lock makes it safe
  # to run several.
  pricing:
    profiles: ["pricing"]
    build:
      context: .
      dockerfile: services/api/Dockerfile
    command: ["python", "-m", "app.pricing.run"]
    environment:
      API_ENV: ${API_ENV:-development}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-wattswap}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-wattswap}
      REDIS_URL: redis://redis:6379/0
      RPC_URL: http://anvil:8545
      CHAIN_ID: ${CHAIN_ID:-31337}
      PRICER_PRIVATE_KEY: ${PRICER_PRIVATE_KEY:?set PRICER_PRIVATE_KEY in .env}
      PRICING_TICK_SECONDS: ${PRICING_TICK_SECONDS:-15}
      WEATHER_POLL_SECONDS: ${WEATHER_POLL_SECONDS:-600}
      PRICING_CLOCK_MODE: ${PRICING_CLOCK_MODE:-real}
    depends_on:
      api: { condition: service_healthy }

  # The trading workers (matcher, relayer, listener, sweeper) as their own process. Opt-in: set
  # TRADING_EMBEDDED=false in .env so the API does not also run them, then
  # `docker compose --profile trading up -d trading`. Redis leader locks make it safe to run several.
  trading:
    profiles: ["trading"]
    build:
      context: .
      dockerfile: services/api/Dockerfile
    command: ["python", "-m", "app.trading.run"]
    environment:
      API_ENV: ${API_ENV:-development}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-wattswap}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-wattswap}
      REDIS_URL: redis://redis:6379/0
      RPC_URL: http://anvil:8545
      CHAIN_ID: ${CHAIN_ID:-31337}
      RELAYER_PRIVATE_KEY: ${RELAYER_PRIVATE_KEY:?set RELAYER_PRIVATE_KEY in .env}
      LISTENER_CONFIRMATIONS: ${LISTENER_CONFIRMATIONS:-1}
      LISTENER_START_BLOCK: ${LISTENER_START_BLOCK:-0}
    depends_on:
      api: { condition: service_healthy }

  # SIMULATED smart meter (not real hardware). Opt-in: needs a provisioned meter first
  # (`make sim-provision`), then `docker compose --profile sim up meter-sim`.
  meter-sim:
    profiles: ["sim"]
    build: ./services/meter-sim
    environment:
      READING_INTERVAL_SECONDS: ${READING_INTERVAL_SECONDS:-900}
    command:
      - run
      - --api=http://api:8000
      - --config=/runtime/meters.json
      - --demo
      - --demo-seconds=${SIM_DEMO_SECONDS:-20}
    volumes: ["./services/meter-sim/runtime:/runtime:ro"]
    depends_on:
      api: { condition: service_healthy }

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    environment:
      API_INTERNAL_URL: http://api:8000
    ports: ["${WEB_PORT:-3000}:3000"]
    depends_on:
      api: { condition: service_healthy }
    healthcheck:
      test:
        - "CMD"
        - "node"
        - "-e"
        - "fetch('http://127.0.0.1:3000').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

volumes:
  pgdata:
