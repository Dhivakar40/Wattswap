[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc_version = "0.8.24"
evm_version = "cancun"
fs_permissions = [{ access = "read-write", path = "../packages/shared/vectors" }]
optimizer = true
optimizer_runs = 200
remappings = [
  "src/=src/",
  "script/=script/",
  "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
  "forge-std/=lib/forge-std/src/",
]

[fmt]
line_length = 100
tab_width = 4

[fuzz]
runs = 256

[invariant]
runs = 64
depth = 32

[profile.ci.fuzz]
runs = 2048

[profile.ci.invariant]
runs = 256
depth = 64
fail_on_revert = false
