[project]
name = "wattswap-api"
version = "0.0.0"
description = "WattSwap FastAPI backend"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "sqlalchemy[asyncio]>=2.0.36",
  "asyncpg>=0.30",
  "alembic>=1.14",
  "redis>=5.2",
  "web3>=7.0,<8",
  "httpx>=0.28",
  "prometheus-client>=0.21",
  "pyjwt>=2.9",
  "siwe>=4.3",
  "abnf==2.4.0",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "pytest-cov>=6.0",
  "ruff>=0.8",
  "mypy>=1.13",
  "hypothesis>=6.170.1",
  "respx>=0.23.1",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "S", "ANN", "ASYNC", "RUF"]

ignore = [
  "E501",  # long strings/messages are fine; `ruff format` owns code layout
  "S101",  # assert is used for type narrowing only
]

[tool.ruff.lint.per-file-ignores]
"app/pricing/params.py" = ["RUF009"]  # Decimal defaults are immutable
"tests/**" = ["S101", "S105", "S311", "ANN401", "ASYNC109"]

[tool.mypy]
strict = true
python_version = "3.12"
mypy_path = "../meter-sim"
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
# These libraries ship type hints but do not re-export their public names explicitly.
module = ["eth_utils", "eth_utils.*", "eth_abi", "eth_abi.*", "hexbytes", "eth_account.*"]
implicit_reexport = true

[[tool.mypy.overrides]]
module = ["siwe", "siwe.*", "asyncpg", "asyncpg.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = [".", "../meter-sim"]
markers = ["integration: end-to-end pipeline against real Anvil, Postgres and Redis"]

[tool.coverage.run]
source = ["app"]
# SQLAlchemy's async layer runs on greenlets; without this, awaited DB code is under-reported.
concurrency = ["thread", "greenlet"]
